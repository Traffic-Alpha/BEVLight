[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bevlight"
version = "0.1.0"
description = "Generalizable traffic signal control from UAV bird's-eye-view visual observations"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "WANG Maonan" }]

# Only what is imported at module top level lives here. Everything the code
# imports inside a function is an extra below, because that laziness is the
# design: `import bevlight.env.wrapper` must not drag in gymnasium, and the
# layering test must run without torch or SUMO.
#
# Install the CUDA build of torch that matches the machine *before* this
# package; pip leaves an already-installed torch alone.
dependencies = [
    "numpy",
    "torch",
]

[project.optional-dependencies]
# Rendering, lane masks, frame checks: cv2 everywhere, timm for the backbone.
vision = ["opencv-python", "timm"]
# Building networks and projecting the BEV camera. One-off scenario commands.
scenario = ["shapely"]
# The gymnasium/SB3 surface over JunctionEnv.
rl = ["gymnasium", "stable-baselines3"]
dev = ["pytest", "ruff"]

# TransSimHub comes from a sibling checkout (TSHUB_ROOT), not PyPI, and
# sumolib/traci come with SUMO (SUMO_HOME/tools). Neither is installable here.
[project.scripts]
bevlight = "bevlight.cli:main"

[tool.setuptools.packages.find]
include = ["bevlight*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned rather than left to default, and deliberately short. Ruff's default
# selection has widened across releases -- upgrading the tool added ninety
# findings to a tree nobody had touched -- so leaving it unset means the
# standard moves when the tool moves.
#
# What is here catches mistakes and helps someone read the file for the first
# time. What is not here is style opinion: this is research code, and a lint
# rule that only ever produces a diff is a tax on the experiment.
select = [
    "E4", "E7", "E9",  # pycodestyle: imports, statements, syntax
    "F",               # pyflakes: names that are unused, undefined or shadowed
    "I",               # import order, so the top of a file reads the same way
    "UP",              # syntax this Python version made obsolete
]
ignore = [
    # `for l in lanes` is a lane. Renaming six of those buys nothing.
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# `pytest.importorskip` has to run before the imports it guards, which is the
# whole point of it, and E402 has no way to know that.
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["bevlight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_scenarios: reads generated per-junction scenario data",
    "slow: needs a SUMO simulation; minutes rather than seconds",
]
